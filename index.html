  state.timeline=Array.isArray(v.timeline)&&v.timeline.length===4&&new Set(v.timeline).size===4&&v.timeline.every(n=>Number.isInteger(n)&&n>=0&&n<events.length)?v.timeline.slice().sort((a,b)=>a-b):state.timeline;
  state.order=Array.isArray(v.order)?[...new Set(v.order.filter(n=>state.timeline.includes(n)))].slice(0,4):[];
  state.runBest=Number.isInteger(v.runBest)?Math.max(0,Math.min(999,v.runBest)):0;state.slow=Boolean(v.slow);for(const mode of ['normal','practice']){const a=v.runScores?.[mode];state.runScores[mode]=Array.isArray(a)?a.filter(r=>r&&Number.isInteger(r.points)&&r.points>=0&&r.points<=10000000&&Number.isInteger(r.books)&&r.books>=0&&r.books<=999&&Number.isInteger(r.combo)&&r.combo>=0&&r.combo<=999&&typeof r.win==='boolean').map(r=>({points:r.points,books:r.books,combo:r.combo,win:r.win})).sort((a,b)=>b.points-a.points).slice(0,5):[];}
  const q=v.quiz;
  if(q&&Array.isArray(q.ids)&&q.ids.length===10&&new Set(q.ids).size===10&&q.ids.every(id=>questionBank.some(x=>x.id===id))&&Array.isArray(q.perms)&&q.perms.length===10&&q.perms.every(p=>Array.isArray(p)&&p.length===4&&new Set(p).size===4&&p.every(n=>Number.isInteger(n)&&n>=0&&n<4))){
   const answers=[];if(Array.isArray(q.answers))for(const a of q.answers.slice(0,10)){if(!Number.isInteger(a)||a<0||a>3)break;answers.push(a);}
   state.quiz={ids:q.ids,perms:q.perms,answers,cursor:Math.min(answers.length,Number.isInteger(q.cursor)?Math.max(0,q.cursor):0)};
  }
  state.project=Number.isInteger(v.project)&&v.project>=0&&v.project<3?v.project:0;
  state.name=typeof v.name==='string'?v.name.slice(0,12):'';state.action=typeof v.action==='string'?v.action.slice(0,90):'';
 }else{
  const previous=JSON.parse(localStorage.getItem('qiushi-journey-v1'));
  if(previous?.version===1){oldProgress=true;state.name=typeof previous.name==='string'?previous.name.slice(0,12):'';state.action=typeof previous.action==='string'?previous.action.slice(0,90):'';if(previous.completed?.[0]){state.completed[0]=true;state.timeline=[0,1,3,6];state.order=[0,1,3,6];}}
 }
}catch(e){storageOK=false;}
// Completed gates are checked against their saved task results.
if(!state.order.every((n,i)=>n===state.timeline[i])||state.order.length!==4)state.completed[0]=false;
if(state.runBest<8)state.completed[1]=false;
if(!state.quiz||state.quiz.cursor!==10||state.quiz.answers.length!==10)state.completed[2]=false;
if(state.action.trim().replace(/\s/g,'').length<8)state.completed[3]=false;
for(let i=1;i<4;i++)if(!state.completed[i-1])state.completed[i]=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}}

function ensureQuiz(){if(state.quiz)return;const allocations=[['校园',3],['求是',3],['校歌',2],['共创',2]];let selected=[];for(const [g,n]of allocations)selected.push(...shuffled(questionBank.filter(q=>q.group===g)).slice(0,n));state.quiz={ids:shuffled(selected).map(q=>q.id),perms:Array.from({length:10},()=>shuffled([0,1,2,3])),answers:[],cursor:0};save();}
function score(){const q=state.quiz;if(!q)return 0;return q.answers.reduce((s,a,i)=>s+(a===questionBank.find(x=>x.id===q.ids[i]).correct?1:0),0);}

function openSources(){if(run?.status==='running')pauseRun();modalFocus=document.activeElement;$('#modal-body').innerHTML=`<p>《求是行旅》以“溯源—守护—求真—共创”四次行动，连接浙大校史、文化精神与青年实践。</p><h3>校史与文化资料</h3><ul>${sources.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener noreferrer">浙江大学官网 · ${s[0]} ↗</a><br>${s[2]}</li>`).join('')}</ul><p>资料核对日期：2026年11月8日。首页校徽采用浙江大学官网校标；实景照片为浙大图库《晴空下的南大门》，摄影：汤新一，保留原图水印。游戏场景为程序绘制。</p><p><a href="https://www.zju.edu.cn/xb/list.htm" target="_blank" rel="noopener noreferrer">校徽来源：浙江大学官网校标页 ↗</a><br><a href="http://pic.zju.edu.cn/_s2/2023/0718/c7a587/page.psp" target="_blank" rel="noopener noreferrer">照片来源：浙大图库校园美图获奖作品 ↗</a></p><h3>情境边界</h3><p>第二站的三条路线、书箱、障碍和护书罩，以及第三站的方法与文化实践情境均为虚构互动设计，不代表特定历史人物的真实经历。游戏称号与行动卡不是学校认证。</p><h3>题库与称号规则</h3><p>知识题库共40题，分为校园、校歌、求是和共创四类，不包含第一关的校史年代题。每轮分组抽取10道不重复题目，题序和选项顺序打乱。每题只接受一次提交，错误答案同样展示解析；刷新后保留本轮题目和得分。完整作答后按答对数量授予称号，重新挑战会重新抽题并更新称号。</p>${rankTable()}<h3>操作与进度</h3><p>护书小游戏初始45秒，保住18箱后可选择安全抵达，或继续冲分至倒计时结束。普通书100分、珍本书300分，连续接书每4箱提高一档倍率，最高5倍。漏书中断连护；无护罩碰撞扣耐久、掉1箱并扣200分。护罩、吸附和修复道具可在途中拾取。安全抵达额外奖励1000分、每点耐久200分、每秒余时10分。稳行3秒，初始一次，每8连护补充一次（最多储存2次）；P键暂停。标准与练习模式各保存本机前五次纪录。切换窗口会自动暂停，返回后手动继续。小游戏离关后重新开始，已经获得的护送记录和印记保留。</p><p>无需注册；署名、行动计划和进度仅尝试保存在当前浏览器，不上传。更换设备或清除浏览器数据后不会同步。重新启程会清除本机本作品的进度。</p>`;$('#modal-wrap').hidden=false;document.body.style.overflow='hidden';$('#modal').focus();}

// Continuous book delivery with combo scoring and optional early banking.
let run=null,raf=0;
const playerY=452,RUN_GOAL=18;
function multiplier(combo){return Math.min(5,1+Math.floor(Math.max(0,combo-1)/4));}
function runGrade(points,win){if(!win)return {letter:'—',label:'未抵达'};return points>=12000?{letter:'S',label:'护书高手'}:points>=7500?{letter:'A',label:'山路熟手'}:points>=4000?{letter:'B',label:'稳稳送达'}:{letter:'C',label:'初次上路'};}
function currentRecord(){return state.runScores[state.slow?'practice':'normal'][0]?.points||0;}
function stopRun(){cancelAnimationFrame(raf);raf=0;run=null;}
function moveRun(delta){if(run?.status!=='running')return;run.lane=Math.max(0,Math.min(2,run.lane+delta));}
function startRun(){cancelAnimationFrame(raf);run={status:'running',lane:1,position:1,score:0,points:0,hp:3,shield:false,magnet:0,time:state.slow?65:45,elapsed:0,nextRow:.55,items:[],last:performance.now(),flash:0,immune:0,rows:0,lastBook:1,combo:0,bestCombo:0,particles:[],popups:[],steady:0,steadyCharges:1,missed:0,damage:0,gold:0,goalNotice:false};$('#run-overlay').hidden=true;$('#run-result').hidden=true;$('#run-start').textContent='重来';$('#run-pause').disabled=false;$('#run-pause').textContent='暂停';$('#run-message').textContent='出发。先接稳，再争取连护倍率。';updateRunStats();$('.run-area').scrollIntoView({block:'center',behavior:'instant'});$('#run-canvas').focus({preventScroll:true});raf=requestAnimationFrame(tickRun);}
function steadyRun(){if(run?.status!=='running'||run.steadyCharges<=0||run.steady>0)return;run.steady=3;run.steadyCharges--;$('#run-message').textContent='稳行3秒。每连续接住8箱，可补充一次机会。';updateRunStats();}
function updateRunStats(){if(!run)return;$('#run-score').textContent=run.score;$('#run-points').textContent=run.points.toLocaleString('zh-CN');$('#run-combo').textContent=run.combo+'连护 · ×'+multiplier(run.combo);$('#run-hp').textContent='●'.repeat(Math.max(0,run.hp))+'○'.repeat(3-Math.max(0,run.hp));$('#run-time').textContent=Math.max(0,Math.ceil(run.time));$('#run-buff').textContent=(run.shield?'护罩已备':'无护罩')+(run.magnet>0?' · 吸附'+Math.ceil(run.magnet)+'秒':'');$('#run-phase').textContent=run.elapsed<7?'山麓':run.elapsed<15?'山道':'雨途';$('#run-steady').textContent=run.steady>0?'稳行中':'稳行 '+run.steadyCharges;$('#run-steady').disabled=run.steady>0||run.steadyCharges===0;$('#run-bank').disabled=run.score<RUN_GOAL;$('#run-bank').textContent=run.score>=RUN_GOAL?'安全抵达 →':'18箱后可抵达';}
function pauseRun(){if(!run||!['running','paused'].includes(run.status))return;if(run.status==='running'){run.status='paused';cancelAnimationFrame(raf);$('#run-overlay').hidden=false;$('#run-overlay-title').textContent='已暂停';$('#run-overlay-note').textContent='点击“继续”或按P接着走。';$('#run-pause').textContent='继续';}else{run.status='running';run.last=performance.now();$('#run-overlay').hidden=true;$('#run-pause').textContent='暂停';raf=requestAnimationFrame(tickRun);}}

function addRunPoints(points,text,color='#f3dda1'){run.points=Math.max(0,run.points+points);run.popups.push({x:roadX(run.position,playerY,run.elapsed),y:playerY-65,text,life:1,color});}
function recordList(){const records=state.runScores[state.slow?'practice':'normal'];return '<section class="run-records"><h3>本机纪录 <small>'+ (state.slow?'练习模式':'标准模式')+'</small></h3>'+(records.length?'<ol>'+records.map((r,i)=>'<li><span class="record-place">'+(i+1)+'</span><strong>'+r.points.toLocaleString('zh-CN')+'分</strong><span>'+r.books+'箱 · 最长'+r.combo+'连护</span><span>'+runGrade(r.points,r.win).label+'</span></li>').join('')+'</ol>':'<p>完成一局后，这里会留下你的得分。只记录本机游玩结果。</p>')+'</section>';}
function finishRun(win){const frame=document.createElement('canvas');frame.width=960;frame.height=540;frame.getContext('2d').drawImage($('#run-canvas'),0,0);const phase=run.elapsed<7?'山麓':run.elapsed<15?'山道':'雨途';const f={hp:run.hp,time:Math.max(0,Math.ceil(run.time)),shield:run.shield,books:run.score,base:run.points,combo:run.bestCombo,gold:run.gold,missed:run.missed,damage:run.damage};run.status=win?'won':'lost';cancelAnimationFrame(raf);f.clearBonus=win?1000:0;f.hpBonus=win?f.hp*200:0;f.timeBonus=win?f.time*10:0;f.points=f.base+f.clearBonus+f.hpBonus+f.timeBonus;const grade=runGrade(f.points,win),mode=state.slow?'practice':'normal',oldBest=currentRecord();state.runScores[mode].push({points:f.points,books:f.books,combo:f.combo,win});state.runScores[mode].sort((a,b)=>b.points-a.points);state.runScores[mode]=state.runScores[mode].slice(0,5);state.runBest=Math.max(state.runBest,f.books);if(win)state.completed[1]=true;save();render();$('#run-canvas').getContext('2d').drawImage(frame,0,0);$('#run-phase').textContent=phase;$('#run-bank').textContent=win?'已抵达':'本局结束';$('#run-start').textContent='再玩一局';$('#run-score').textContent=f.books;$('#run-points').textContent=f.points.toLocaleString('zh-CN');$('#run-combo').textContent='最长'+f.combo+'连护';$('#run-hp').textContent='●'.repeat(Math.max(0,f.hp))+'○'.repeat(3-Math.max(0,f.hp));$('#run-time').textContent=f.time;$('#run-buff').textContent=f.shield?'护罩已备':'无护罩';$('#run-overlay-title').textContent=win?grade.letter+'级 · '+grade.label:'这次没能抵达';$('#run-overlay-note').textContent=f.points.toLocaleString('zh-CN')+'分 · 保住'+f.books+'箱 · 最长'+f.combo+'连护';$('#run-message').textContent=f.points>oldBest?'本模式的新纪录！':'再来一局，试着把连护接得更长。';$('#run-result').hidden=false;$('#run-result').innerHTML='<div class="result-score"><span class="grade-seal">'+grade.letter+'</span><div><p>'+grade.label+(f.points>oldBest?' · 新纪录':'')+'</p><strong>'+f.points.toLocaleString('zh-CN')+'<small> 分</small></strong></div></div><div class="score-ledger"><span>途中积分 <b>'+f.base+'</b></span><span>抵达奖励 <b>+'+f.clearBonus+'</b></span><span>耐久奖励 <b>+'+f.hpBonus+'</b></span><span>余时奖励 <b>+'+f.timeBonus+'</b></span></div><p class="run-summary">保住'+f.books+'箱，收集珍本'+f.gold+'箱，最长'+f.combo+'连护。'+(win?'可以继续下一关，也可以重玩冲分。':'本轮积分已记入纪录；通关需要保住18箱并安全抵达。')+'</p>';}
function tickRun(now){if(run?.status!=='running')return;const dt=Math.min((now-run.last)/1000,.05);run.last=now;run.time-=dt;run.elapsed+=dt;run.flash=Math.max(0,run.flash-dt);run.immune=Math.max(0,run.immune-dt);run.steady=Math.max(0,run.steady-dt);run.magnet=Math.max(0,run.magnet-dt);run.position+=(run.lane-run.position)*Math.min(1,dt*15);const phase=run.elapsed<7?0:run.elapsed<15?1:2;
 if(run.elapsed>=run.nextRow){const possible=[0,1,2].filter(n=>Math.abs(n-run.lastBook)<=1),book=shuffled(possible)[0],others=shuffled([0,1,2].filter(n=>n!==book));run.lastBook=book;run.items.push({lane:book,y:100,type:run.rows%6===4?'gold':'book',hit:false});const count=state.slow?1:phase===0&&run.rows<3?1:2;for(let j=0;j<count;j++)run.items.push({lane:others[j],y:100,type:phase===2&&j===0||run.rows%3===1?'water':'rock',hit:false});if(run.rows%5===3){const lane=others.at(-1),type=['shield','magnet','repair'][Math.floor(run.rows/5)%3];run.items=run.items.filter(x=>!(x.y===100&&x.lane===lane));run.items.push({lane,y:100,type,hit:false});}run.rows++;run.nextRow=run.elapsed+(state.slow?1.5:[1.05,.9,.8][phase]);}
 const speed=(state.slow?Math.min(215,135+run.elapsed*2.2):Math.min(355,215+run.elapsed*7.5))*(run.steady>0?.53:1);
 for(const item of run.items){const prev=item.y;item.y+=speed*dt;const isBook=item.type==='book'||item.type==='gold',reach=isBook&&run.magnet>0?1.05:.33;
  if(!item.hit&&Math.abs(item.lane-run.position)<reach&&item.y>=playerY-28&&prev<=playerY+28){
   if(isBook){item.hit=true;run.score++;run.combo++;run.bestCombo=Math.max(run.bestCombo,run.combo);const base=item.type==='gold'?300:100,m=multiplier(run.combo);if(item.type==='gold')run.gold++;addRunPoints(base*m,'+'+(base*m)+'分');for(let i=0;i<9;i++)run.particles.push({x:roadX(item.lane,playerY,run.elapsed),y:playerY-18,vx:Math.cos(i*.8)*70,vy:-60-Math.sin(i)*35,life:.55});if(run.combo%8===0){run.steadyCharges=Math.min(2,run.steadyCharges+1);$('#run-message').textContent=run.combo+'连护，稳行机会+1。';}else $('#run-message').textContent=(item.type==='gold'?'珍本书！':'接稳了，')+'+'+(base*m)+'分。';}

   else if(item.type==='repair'){item.hit=true;if(run.hp<3){run.hp++;run.popups.push({x:roadX(run.position,playerY,run.elapsed),y:playerY-65,text:'耐久 +1',life:1,color:'#b7cee8'});}else addRunPoints(150,'满耐久 +150');$('#run-message').textContent='修复道具已使用；满耐久时折合150分。';}
   else if(run.immune<=0){item.hit=true;run.immune=.7;run.flash=.35;if(run.shield){run.shield=false;$('#run-message').textContent='护罩挡住了碰撞，连护保留。';}else{run.hp--;run.damage++;run.combo=0;run.score=Math.max(0,run.score-1);addRunPoints(-200,'-200','#efb6a2');$('#run-message').textContent='碰撞：掉1箱、扣200分，连护中断。';}}
  }
  if(!item.hit&&isBook&&item.y>playerY+38&&!item.missed){item.missed=true;run.missed++;run.combo=0;$('#run-message').textContent='漏过一箱，连护从头算。';}
 }
 run.items=run.items.filter(x=>x.y<590&&!x.hit);for(const p of run.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;}run.particles=run.particles.filter(p=>p.life>0);for(const p of run.popups){p.y-=dt*36;p.life-=dt;}run.popups=run.popups.filter(p=>p.life>0);updateRunStats();drawRun();if(run.hp<=0){finishRun(false);return;}if(run.time<=0){finishRun(run.score>=RUN_GOAL);return;}if(run.score>=RUN_GOAL&&!run.goalNotice){run.goalNotice=true;$('#run-message').textContent='18箱已达标！可以安全抵达，也可以继续冲分。';}raf=requestAnimationFrame(tickRun);
}

 const sky=c.createLinearGradient(0,0,0,540);sky.addColorStop(0,rain?'#a0afc0':'#d6e4f3');sky.addColorStop(1,rain?'#c4cdd7':'#f3ebd6');c.fillStyle=sky;c.fillRect(0,0,960,540);

 const mist=c.createLinearGradient(0,100,0,218);mist.addColorStop(0,'#dbe7f500');mist.addColorStop(.5,'#dbe7f54d');mist.addColorStop(1,'#dbe7f500');c.fillStyle=mist;c.fillRect(0,100,960,118);
 c.fillStyle=rain?'#657c97':'#7d92a9';c.beginPath();c.moveTo(0,358);c.quadraticCurveTo(215,222,466,193);c.quadraticCurveTo(704,223,960,346);c.lineTo(960,540);c.lineTo(0,540);c.fill();

 c.fillStyle='#42516329';for(let i=0;i<47;i++){const y=130+(i*53+t*(rain?44:35))%410,d=(y-120)/420,x=roadCenter(y,t)+Math.sin(i*63.1)*(80+320*d);c.beginPath();c.ellipse(x,y,1+2*d,.6+d,.3,0,Math.PI*2);c.fill();}
 // Pine trees and grass at the verge; near objects move faster.

 // Milestone at the road edge.

document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=Number(b.dataset.id);
 if(action==='sources'){openSources();return;}if(action==='close-modal'){closeModal();return;}
 if(action==='home'){view='home';feedback='';render(true);return;}
 if(action==='chapter'){if(!Number.isInteger(id)||id<0||id>3||(id>0&&!state.completed[id-1]))return;view=id;feedback='';render(true);return;}
 if(action==='result'){if(state.completed.every(Boolean)){view='result';render(true);}return;}
 if(action==='reset'){if(!confirm('重新启程会清除当前浏览器中的行旅进度、称号、署名和计划。确定吗？'))return;state=fresh();save();try{localStorage.removeItem('qiushi-journey-v1');}catch(e){}view='home';feedback='';render(true);notify('新的行旅，已经准备好了。');return;}
 if(action==='event'&&view===0&&!state.completed[0]&&state.timeline.includes(id)&&!state.order.includes(id)){state.order.push(id);feedback='';save();render();return;}
 if(action==='undo-order'&&view===0&&!state.completed[0]){state.order.pop();feedback='';save();render();return;}
 if(action==='clear-order'&&view===0&&!state.completed[0]){state.order=[];feedback='';save();render();return;}
 if(action==='check-order'&&view===0){if(state.order.length===4&&state.order.every((n,i)=>n===state.timeline[i]))complete(0);else showFeedback('再核对一下年份与事件。提示：“求是”确立于1938年，“求是创新”确立于1988年；回杭在前，四校合并在后。可以撤回或清空重排。');return;}
 if(action==='bank-run'&&view===1){bankRun();return;}if(action==='steady-run'&&view===1){steadyRun();return;}if(action==='start-run'&&view===1){startRun();return;}if(action==='move'&&view===1){moveRun(id);return;}if(action==='pause-run'&&view===1){pauseRun();return;}
 if(action==='slow-run'&&view===1){state.slow=!state.slow;save();render();notify(state.slow?'已切换练习模式。':'已切换标准模式。');return;}
 if(action==='answer'&&view===2){const quiz=state.quiz,r=quiz.cursor;if(r>=10||quiz.answers.length>r||!Number.isInteger(id)||id<0||id>3)return;quiz.answers.push(id);save();render();$('#main .feedback')?.scrollIntoView({behavior:'instant',block:'nearest'});return;}
 if(action==='next-question'&&view===2){const quiz=state.quiz;if(quiz.cursor>=10||quiz.answers.length<=quiz.cursor)return;quiz.cursor++;save();if(quiz.cursor===10)complete(2);else render(true);return;}
 if(action==='retake-quiz'&&view===2){state.quiz=null;state.completed[2]=false;state.completed[3]=false;ensureQuiz();feedback='';save();render(true);notify('已重新抽取10道题，新的称号等你来挑战。');return;}
 if(action==='project'&&view===3&&!state.completed[3]){if(id<0||id>2)return;state.project=id;save();render();return;}
 if(action==='example'&&view===3&&!state.completed[3]){state.action=projects[state.project].example;save();$('#action-text').value=state.action;$('#char-count').textContent=state.action.length+' / 90';$('#action-text').focus();return;}
 if(action==='finish'&&view===3){state.name=$('#player-name').value.trim().slice(0,12);state.action=$('#action-text').value.trim().slice(0,90);if(state.action.replace(/\s/g,'').length<8){showFeedback('请至少填写8个非空白字符，写清什么时候、为谁、做什么。');$('#action-text').focus();return;}complete(3);return;}
 if(action==='edit-plan'){state.completed[3]=false;save();view=3;feedback='';render(true);return;}
 if(action==='download'){b.disabled=true;try{await downloadCard();notify('行动卡图片已生成，请查看浏览器下载。');}catch(e){notify('可以使用“打印行动卡”保存。');}finally{if(b.isConnected)b.disabled=false;}return;}
 if(action==='print')window.print();
});
document.addEventListener('input',e=>{if(e.target.id==='player-name'){state.name=e.target.value.slice(0,12);save();}if(e.target.id==='action-text'){state.action=e.target.value.slice(0,90);$('#char-count').textContent=state.action.length+' / 90';save();}});
document.addEventListener('pointerdown',e=>{if(e.target.id!=='run-canvas'||run?.status!=='running')return;const r=e.target.getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width;run.lane=x<350?0:x<610?1:2;});
$('#modal-wrap').addEventListener('click',e=>{if(e.target===$('#modal-wrap'))closeModal();});

 if(view===1&&run&&!e.target.matches('input,textarea')){if(run.status==='running'&&['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key)){e.preventDefault();moveRun(['ArrowLeft','a','A'].includes(e.key)?-1:1);}if(e.key===' '&&e.target.id==='run-canvas'){e.preventDefault();steadyRun();}if(['p','P'].includes(e.key)){e.preventDefault();pauseRun();}}
});
