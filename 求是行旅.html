<script>
'use strict';
// Every option list is shuffled for each new challenge; explanations remain attached to stable IDs.
const Q=(id,group,title,prompt,options,explain,source)=>({id,group,title,prompt,options,correct:0,explain,source});
const questionBank=[
Q('n01','校园','浙大在哪里','浙江大学坐落于哪座历史文化名城？',['杭州','南京','苏州','绍兴'],'浙江大学坐落于杭州。认识一所大学，也可以从它所在的城市开始。',0),
Q('n02','校园','认识校区','以下哪组名称都是浙江大学校区？',['紫金港、玉泉、之江','紫金港、仙林、鼓楼','玉泉、邯郸、江湾','之江、闵行、徐汇'],'学校概况列有紫金港、玉泉、西溪、华家池、之江、舟山、海宁等校区。',0),
Q('n03','校园','山海之间','浙江大学校区名称中，哪一个与浙江的海岛城市同名？',['舟山','仙林','珞珈山','五山'],'浙江大学设有舟山校区。可以从官网继续了解各校区与学科特色。',0),
Q('n04','校园','一所怎样的大学','学校官网将浙江大学概括为哪种类型的大学？',['综合型、研究型、创新型大学','仅设置理工学科的专门学校','只面向职业技能培训的学校','仅开展艺术教育的学校'],'学校概况介绍，浙江大学是一所综合型、研究型、创新型大学。',0),
Q('n05','校园','学科的相遇','哪项描述更符合浙大的学科面貌？',['涵盖人文、理工、农医等多个学科领域','所有专业都属于同一个学科','只有农业和医学两个领域','完全不开展人文社会科学研究'],'浙江大学学科门类广泛，学校概况列有哲学、文学、理学、工学、农学、医学等门类。',0),
Q('n06','校园','先看当下','想了解浙大最近的校园新闻，哪个入口更合适？',['浙江大学官网或求是新闻网','未标注时间的旧截图','不知道来源的短视频搬运号','多年前保存的网页缓存'],'了解近期情况，应优先查看官方动态并核对发布时间。此题为信息使用情境。',null),
Q('n07','校园','去校园走走','准备第一次到校参观，比较妥当的做法是什么？',['先查校方最新参访规定、校区位置与交通信息','按几年前的攻略认定每天都能进入','只凭别人一次入校经历推断所有规则','未经核实就向同学承诺可以随意入内'],'参访规则可能调整，出发前应核对校方最新信息。此题不代表对具体开放政策的说明。',null),
Q('n08','校园','照片里的今天','用一组照片介绍校园近况，怎样能让读者判断它是否新近拍摄？',['注明拍摄时间、校区与来源，并核实画面内容','只在标题里写“最新”','把不同年代照片混在一起且不说明','去掉所有日期和说明'],'“最新”需要有时间依据。清楚的拍摄信息比笼统的标签更有帮助。',null),
Q('n09','校园','看见校园生活','想记录真实的大学生活，哪种取材方式更有帮助？',['征得同意后听取不同同学的经历，记录具体场景','预先写好统一答案让所有人照读','用一位同学的经历概括所有人','只留下符合预设印象的片段'],'具体、多样、得到允许的记录，能更充分地呈现校园生活。',null),
Q('n10','校园','跟进一项研究','看到一则浙大科研新闻，怎样了解它真正解决了什么问题？',['阅读报道与原始研究说明，留意方法、结果和适用范围','只凭标题就认定已全面应用','把一次实验结果当成普遍结论','认为没有被转发的研究就没有价值'],'了解科研进展，需要分清研究发现、试验阶段和应用范围。此题为阅读情境。',null),
Q('s01','校歌','谁写下歌词','浙江大学校歌由谁作词？',['马一浮','竺可桢','应尚能','路甬祥'],'浙江大学校歌由马一浮作词、应尚能作曲。',3),
Q('s02','校歌','谁谱下旋律','浙江大学校歌由谁作曲？',['应尚能','马一浮','竺可桢','朱兆祥'],'应尚能为校歌谱曲。引用创作信息时要区分词作者与曲作者。',3),
Q('s03','校歌','海纳江河','校歌“大不自多”的下一句是什么？',['海纳江河','在浙之滨','开物前民','天下来同'],'校歌开篇为“大不自多，海纳江河”，可体会其中开阔、谦逊的胸怀。',3),
Q('s04','校歌','求真之声','校歌“昔言求是”的下一句是什么？',['实启尔求真','在浙之滨','始见经纶','知至知终'],'校歌原文为“昔言求是，实启尔求真”，点明了求真的追求。',3),
Q('s05','校歌','新与故','校歌“靡革匪因”的下一句是什么？',['靡故匪新','思睿观通','有农有工','无吝于宗'],'原文为“靡革匪因，靡故匪新”。官网译文以继承与创新的关系帮助理解。',3),
Q('s06','校歌','开物前民','校歌“何以新之”的下一句是什么？',['开物前民','海纳江河','知至知终','树我邦国'],'原文为“何以新之，开物前民”，把创新与实践探索联系起来。',3),
Q('s07','校歌','在浙之滨','校歌“国有成均”的下一句是什么？',['在浙之滨','际于天地','尔听斯聪','尚其有闻'],'校歌原文为“国有成均，在浙之滨”。',3),
Q('s08','校歌','文与质','以下哪组词句确实出现在浙江大学校歌中？',['有文有质，有农有工','格物致知，止于至善','允公允能，日新月异','自强不息，厚德载物'],'“有文有质，有农有工”见于浙大校歌原文。其他选项也有文化内涵，但并非本题所问原句。',3),
Q('s09','校歌','学无止境','结合校歌原文，下列哪种理解更贴近“无曰已是，无曰遂真”？',['保持求知和求证的开放态度，不轻言已穷尽真理','得到一个答案就应停止研究','所有判断都无法讨论','已有知识完全没有价值'],'官网译文提醒，不要说已经把握本质或穷尽真理。这里鼓励持续探究。',3),
Q('s10','校歌','让校歌被理解','为第一次接触校歌的同学做短片，哪种方法更妥当？',['核对原文和背景，注明出处，并清楚标出自己的解读','把个人改写标为原歌词','用未经核实的感人故事解释作者经历','只保留热度最高的网络解释'],'这是一道传播情境题：保留可靠出处，同时用新的表达帮助理解。',3),
Q('t01','求是','面对异常','一次校园观察中，第四次读数明显偏离前三次。你会怎样处理？',['保留异常记录，检查条件与仪器，再按规则复测','直接删除第四次读数','用前三次平均数替换第四次','只报告更符合预期的结果'],'异常需要调查。记录条件、检查设备并复测，才能让结论有可检验的依据。',2),
Q('t02','求是','两种说法','两份材料对同一校史事件的日期说法不同，优先怎么做？',['追溯原始材料，对照来源和时间，暂不下定论','采用点赞更多的说法','选更适合海报版式的日期','把两个日期取平均值'],'求证需要比较材料的来源、年代与证据，不能用传播热度代替核验。',2),
Q('t03','求是','诚实的记录','调研结果与原先设想不一致，报告应该怎么写？',['如实呈现结果，说明限制并调整原先判断','只保留支持设想的访谈','把推测写成调查结论','不写方法以免读者发现差异'],'接受不符合预期的证据、说明研究边界，是实事求是的具体做法。',2),
Q('t04','求是','图片的出处','一张校园照片没有注明来源与拍摄时间，适合直接当作近期新闻的配图吗？',['先核实来源、时间和使用条件，再判断是否适合','有校园建筑就一定是最近拍的','分辨率足够高就可以确定时间','只要改一个文件名就成为新照片'],'图像同样需要核验，拍摄时间、地点与使用条件都不能从清晰度推断。',null),

function renderChapter(){const i=view;$('#main').innerHTML='<div class="page-content"><div class="chapter-head"><div><p class="chapter-kicker">第'+(i+1)+'关 / 共4关</p><h1>'+chapters[i].title+'</h1></div><button class="text-btn" data-action="home">返回首页</button></div><div class="task-layout '+(i===1?'runner-layout':i>1?'single-layout':'')+'"><section class="task-box">'+[stageOne,stageTwo,stageThree,stageFour][i]()+feedbackHTML()+(i===2?'':successPanel(i))+'</section>'+sideHistory(i)+'</div>'+footer()+'</div>';}

function stageOne(){return `<p class="help">从早到晚点击四个事件。排错了可以撤回，旁边有校史小抄。</p><div class="timeline">${state.timeline.map((n,i)=>`<div class="time-slot"><span class="time-year">${events[n].year}</span><span class="time-content ${state.order[i]!==undefined?'filled':''}"><small>0${i+1}</small>${state.order[i]!==undefined?events[state.order[i]].label:'等待放入事件'}</span></div>`).join('')}</div><div class="pick-grid">${[...state.timeline].reverse().map(i=>`<button class="pick" data-action="event" data-id="${i}" ${state.order.includes(i)||state.completed[0]?'disabled':''}>${events[i].label}</button>`).join('')}</div>${state.completed[0]?'':`<div class="button-row"><button class="primary" data-action="check-order" ${state.order.length<4?'disabled':''}>核对时间线 <span class="arrow">→</span></button><button class="secondary" data-action="undo-order" ${!state.order.length?'disabled':''}>撤回一步</button><button class="text-btn" data-action="clear-order" ${!state.order.length?'disabled':''}>清空重排</button></div>`}`;}
function stageTwo(){return '<div class="run-intro"><p>保住<strong>18箱书</strong>就能安全抵达；也可以继续冲分，挑战更高纪录。</p><button class="text-btn" data-action="slow-run">'+(state.slow?'✓ 练习模式':'切换练习模式')+'</button></div><div class="arcade-scorebar"><div><span>本局积分</span><strong id="run-points">0</strong></div><div><span>连护倍率</span><strong class="combo-value" id="run-combo">0连护 · ×1</strong></div><div><span>'+(state.slow?'练习':'标准')+'最高</span><strong>'+currentRecord().toLocaleString('zh-CN')+'</strong></div></div><div class="run-stats"><span>书箱 <strong id="run-score">0</strong> / 18</span><span>耐久 <strong id="run-hp">●●●</strong></span><span>剩余 <strong id="run-time">'+(state.slow?65:45)+'</strong>秒</span><span id="run-buff">无护罩</span><span>路段 <strong id="run-phase">山麓</strong></span></div><div class="run-area"><canvas id="run-canvas" width="960" height="540" tabindex="0" aria-label="左右切换路线接书和道具，躲避障碍，连护可提高积分倍率。空格稳行，P键暂停。"></canvas><div class="run-overlay" id="run-overlay"><div><h3 id="run-overlay-title">这次，能接多少箱？</h3><p id="run-overlay-note">普通书100分，珍本书300分。<br>连续接书提高倍率，护罩、吸附和修复道具会在途中出现。</p></div></div></div><div class="run-controls"><button class="secondary run-direction" data-action="move" data-id="-1" aria-label="向左">← 左</button><button class="primary" id="run-start" data-action="start-run">开始护送</button><button class="secondary" data-action="steady-run" id="run-steady" disabled>稳行 1</button><button class="secondary" id="run-pause" data-action="pause-run" disabled>暂停</button><button class="secondary run-direction" data-action="move" data-id="1" aria-label="向右">右 →</button><button class="secondary bank-button" data-action="bank-run" id="run-bank" disabled>18箱后可抵达</button></div><p class="run-instructions">← → / A D 移动 · 空格稳行 · P 暂停；手机可点路线和按钮。</p><p class="run-message" id="run-message" role="status">'+(state.completed[1]?'本关已完成，重玩可以刷新纪录。':'漏书会断连护；无护罩碰撞会掉箱、扣200分。')+'</p><section class="run-result" id="run-result" aria-label="本轮结算" hidden></section><details class="arcade-rules"><summary>道具与计分规则</summary><div class="pickup-legend"><span><i class="pickup-book">书</i>普通100分 / 珍本300分</span><span><i class="pickup-shield">护</i>抵挡一次碰撞，保住连护</span><span><i class="pickup-magnet">吸</i>6秒内吸附相邻路线书箱</span><span><i class="pickup-repair">+</i>修复1点耐久；满耐久加150分</span></div><p>每连续接住4箱后，下一箱倍率提升一档，最高×5。漏书会中断连护；无护罩碰撞掉1箱、扣200分。每8连护补充一次稳行，最多储存2次。</p><p>抵达奖励1000分、每点剩余耐久200分、每秒剩余时间10分。达到18箱后可提前抵达，也可撑到倒计时结束；耐久耗尽则护送失败，积分仍记录。结算达到4000 / 7500 / 12000分，依次评为B / A / S级；不足4000分为C级，失败记“未抵达”。</p></details>'+recordList();}


function quizReview(){return state.quiz.ids.map((id,i)=>{const q=questionBank.find(x=>x.id===id),a=state.quiz.answers[i],right=a===q.correct;return `<details class="review-item"><summary><span>${right?'✓':'×'} 第${i+1}题 · ${esc(q.title)}</span><span>${right?'答对':'答错'}</span></summary><p>${esc(q.prompt)}</p><p>你的选择：${esc(q.options[a])}<br>正确答案：${esc(q.options[q.correct])}</p><p>${esc(q.explain)}</p>${q.source===null?'<p class="help">文化实践情境 · 本作品设计</p>':`<a href="${sources[q.source][1]}" target="_blank" rel="noopener noreferrer">查看官方史料 ↗</a>`}</details>`;}).join('');}
function stageThree(){const quiz=state.quiz;
 if(quiz.cursor>=10){const n=score();return `<div class="quiz-award"><p class="help">本轮答对 <strong>${n} / 10</strong> 题</p><h2>${titleFor(n)}</h2></div>${rankTable()}${successPanel(2)}<div class="button-row"><button class="secondary" data-action="retake-quiz">随机抽题，再挑战一次 ↻</button></div><p class="help">重新挑战会更新称号；署名和行动计划会保留，答完后可重新收下共创印记。</p><h3 class="review-title">查看本轮答题与解析</h3>${quizReview()}`;}
 const r=quiz.cursor,q=questionBank.find(x=>x.id===quiz.ids[r]),answered=quiz.answers.length>r,a=quiz.answers[r],ok=a===q.correct;
 return `<div class="quiz-meta"><span class="task-label">第 ${r+1} 题 / 10</span><span class="score-chip">已答对 ${score()} 题</span></div><div class="rounds" aria-label="已提交${quiz.answers.length}题，共10题">${quiz.ids.map((_,i)=>`<span class="${i<r?'done':i===r?'current':''}"></span>`).join('')}</div><span class="question-category">${q.group}</span><div class="evidence"><p>${esc(q.prompt)}</p></div><div class="options">${quiz.perms[r].map((n,j)=>`<button class="option ${answered?(n===q.correct?'right':n===a?'wrong':''):''}" data-action="answer" data-id="${n}" ${answered?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${esc(q.options[n])}</span></button>`).join('')}</div>${answered?`<div class="feedback ${ok?'success':''}" role="status"><strong>${ok?'回答正确，记1题。':'本题答错，不计分。'}</strong><br>正确答案：${esc(q.options[q.correct])}<br>${esc(q.explain)}${q.source===null?'':`<br><a href="${sources[q.source][1]}" target="_blank" rel="noopener noreferrer">查看官网依据 ↗</a>`}</div><div class="button-row"><button class="primary" data-action="next-question">${r===9?'查看我的称号':'继续下一题'} <span class="arrow">→</span></button></div>`:''}`;
}
function stageFour(){return `<p class="help">本轮知识称号：<strong>${titleFor(score())}</strong>（${score()} / 10）。选一个方向，写清“什么时候、为谁、做什么”。</p><div class="project-grid">${projects.map((p,i)=>`<button class="project" data-action="project" data-id="${i}" aria-pressed="${state.project===i}" ${state.completed[3]?'disabled':''}><span class="project-icon">${p.icon}</span><strong>${p.title}</strong><small>${p.desc}</small></button>`).join('')}</div><label class="field-label" for="player-name">你的署名 / 可选，最多12字</label><input class="input" id="player-name" maxlength="12" autocomplete="off" placeholder="例如：一位求是青年" value="${esc(state.name)}" ${state.completed[3]?'readonly':''}><label class="field-label" for="action-text">我的文化传承小计划 / 8–90字</label><textarea id="action-text" maxlength="90" placeholder="写一件近期可以开始的文化小事。" ${state.completed[3]?'readonly':''}>${esc(state.action)}</textarea><div class="field-foot">${state.completed[3]?'<span>计划已记录，可在行动卡中保存。</span>':'<button class="example-btn" data-action="example">填入本方向示例，再按自己的想法修改。</button>'}<span id="char-count">${state.action.length} / 90</span></div>${state.completed[3]?'':`<div class="button-row"><button class="primary" data-action="finish">收下共创印记 <span class="arrow">↗</span></button></div>`}`;}
function feedbackHTML(){return `<div id="feedback" role="status" aria-live="polite">${feedback?`<p class="feedback ${feedbackOK?'success':''}">${feedback}</p>`:''}</div>`;}
function successPanel(i){if(!state.completed[i])return '';return '<section class="success-panel"><div><span class="completion-mark">✓</span><h3>'+['时间线排好了','护送完成','答题完成','计划已保存'][i]+'</h3><p>'+['可以去试试下一关了。','本关印记已收集，可以继续答题。','本轮答对'+score()+'题，获得“'+titleFor(score())+'”称号。','可以把计划和称号保存成一张卡片。'][i]+'</p></div><button class="primary" data-action="'+(i===3?'result':'chapter')+'" data-id="'+(i+1)+'">'+(i===3?'查看行动卡':'下一关')+' →</button></section>';}

function renderResult(){const project=projects[state.project];$('#main').innerHTML=`<div class="fade-in result-wrap"><div class="result-top"><h1>这趟行旅，留个纪念。</h1></div><article class="postcard"><div class="postcard-top"><span class="eyebrow">求是行旅</span><span class="serif" style="font-size:15px;letter-spacing:3px">求是创新</span></div><h2>我的求是行动卡</h2><p class="result-name">行旅人 · ${esc(state.name.trim()||'一位求是青年')} / 4枚精神印记</p><div class="card-rank"><span>本轮知识称号</span><strong>${titleFor(score())}</strong><small>答对 ${score()} / 10 题</small></div><div class="action-label">我的文化创作方向 / ${project.title}</div><p class="action-text">${esc(state.action)}</p><div class="stamp-row">${stamps()}</div><div class="postcard-bottom"><span>循校史之脉 · 以青年之创</span><span>游戏纪念卡 · 非官方证明</span></div></article><div class="result-actions"><button class="primary" data-action="download">保存行动卡图片 ↓</button><button class="secondary" data-action="edit-plan">修改我的计划</button><button class="secondary" data-action="home">返回首页</button></div><p class="result-note">称号按本轮成绩生成。想换个成绩，可以回第三关再试一次。</p><div style="text-align:center"><button class="text-btn" data-action="print">打印行动卡</button></div>${footer()}</div>`;}
function complete(i){state.completed[i]=true;save();feedback='';feedbackOK=false;render();notify(`第${i+1}关完成`);$('.success-panel')?.scrollIntoView({behavior:'instant',block:'nearest'});}
function showFeedback(msg,ok=false){feedback=msg;feedbackOK=ok;const box=$('#feedback');if(box)box.innerHTML=`<p class="feedback ${ok?'success':''}">${msg}</p>`;}
function openSources(){if(run?.status==='running')pauseRun();modalFocus=document.activeElement;$('#modal-body').innerHTML=`<p>《求是行旅》以“溯源—守护—求真—共创”四次行动，连接浙大校史、文化精神与青年实践。</p><h3>校史与文化资料</h3><ul>${sources.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener noreferrer">浙江大学官网 · ${s[0]} ↗</a><br>${s[2]}</li>`).join('')}</ul><p>资料核对日期：2026年11月8日。建筑图形为概念插画，非实测复原；“求是为径，创新以行”等为本作品创作文案。</p><h3>情境边界</h3><p>第二站的三条路线、书箱、障碍和护书罩，以及第三站的方法与文化实践情境均为虚构互动设计，不代表特定历史人物的真实经历。游戏称号与行动卡不是学校认证。</p><h3>题库与称号规则</h3><p>知识题库共40题，分为校园、校歌、求是和共创四类，不包含第一关的校史年代题。每轮分组抽取10道不重复题目，题序和选项顺序打乱。每题只接受一次提交，错误答案同样展示解析；刷新后保留本轮题目和得分。完整作答后按答对数量授予称号，重新挑战会重新抽题并更新称号。</p>${rankTable()}<h3>操作与进度</h3><p>护书小游戏初始45秒，保住18箱后可选择安全抵达，或继续冲分至倒计时结束。普通书100分、珍本书300分，连续接书每4箱提高一档倍率，最高5倍。漏书中断连护；无护罩碰撞扣耐久、掉1箱并扣200分。护罩、吸附和修复道具可在途中拾取。安全抵达额外奖励1000分、每点耐久200分、每秒余时10分。稳行3秒，初始一次，每8连护补充一次（最多储存2次）；P键暂停。标准与练习模式各保存本机前五次纪录。切换窗口会自动暂停，返回后手动继续。小游戏离关后重新开始，已经获得的护送记录和印记保留。</p><p>无需注册；署名、行动计划和进度仅尝试保存在当前浏览器，不上传。更换设备或清除浏览器数据后不会同步。重新启程会清除本机本作品的进度。</p>`;$('#modal-wrap').hidden=false;document.body.style.overflow='hidden';$('#modal').focus();}
function closeModal(){$('#modal-wrap').hidden=true;document.body.style.overflow='';if(modalFocus?.isConnected)modalFocus.focus();}

// Continuous book delivery with combo scoring and optional early banking.
let run=null,raf=0;
const playerY=452,RUN_GOAL=18;
function multiplier(combo){return Math.min(5,1+Math.floor(Math.max(0,combo-1)/4));}
function runGrade(points,win){if(!win)return {letter:'—',label:'未抵达'};return points>=12000?{letter:'S',label:'护书高手'}:points>=7500?{letter:'A',label:'山路熟手'}:points>=4000?{letter:'B',label:'稳稳送达'}:{letter:'C',label:'初次上路'};}
function currentRecord(){return state.runScores[state.slow?'practice':'normal'][0]?.points||0;}
function stopRun(){cancelAnimationFrame(raf);raf=0;run=null;}
function moveRun(delta){if(run?.status!=='running')return;run.lane=Math.max(0,Math.min(2,run.lane+delta));}
function startRun(){cancelAnimationFrame(raf);run={status:'running',lane:1,position:1,score:0,points:0,hp:3,shield:false,magnet:0,time:state.slow?65:45,elapsed:0,nextRow:.55,items:[],last:performance.now(),flash:0,immune:0,rows:0,lastBook:1,combo:0,bestCombo:0,particles:[],popups:[],steady:0,steadyCharges:1,missed:0,damage:0,gold:0,goalNotice:false};$('#run-overlay').hidden=true;$('#run-result').hidden=true;$('#run-start').textContent='重来';$('#run-pause').disabled=false;$('#run-pause').textContent='暂停';$('#run-message').textContent='出发。先接稳，再争取连护倍率。';updateRunStats();$('.run-area').scrollIntoView({block:'center',behavior:'instant'});$('#run-canvas').focus({preventScroll:true});raf=requestAnimationFrame(tickRun);}
function steadyRun(){if(run?.status!=='running'||run.steadyCharges<=0||run.steady>0)return;run.steady=3;run.steadyCharges--;$('#run-message').textContent='稳行3秒。每连续接住8箱，可补充一次机会。';updateRunStats();}
function updateRunStats(){if(!run)return;$('#run-score').textContent=run.score;$('#run-points').textContent=run.points.toLocaleString('zh-CN');$('#run-combo').textContent=run.combo+'连护 · ×'+multiplier(run.combo);$('#run-hp').textContent='●'.repeat(Math.max(0,run.hp))+'○'.repeat(3-Math.max(0,run.hp));$('#run-time').textContent=Math.max(0,Math.ceil(run.time));$('#run-buff').textContent=(run.shield?'护罩已备':'无护罩')+(run.magnet>0?' · 吸附'+Math.ceil(run.magnet)+'秒':'');$('#run-phase').textContent=run.elapsed<7?'山麓':run.elapsed<15?'山道':'雨途';$('#run-steady').textContent=run.steady>0?'稳行中':'稳行 '+run.steadyCharges;$('#run-steady').disabled=run.steady>0||run.steadyCharges===0;$('#run-bank').disabled=run.score<RUN_GOAL;$('#run-bank').textContent=run.score>=RUN_GOAL?'安全抵达 →':'18箱后可抵达';}
function pauseRun(){if(!run||!['running','paused'].includes(run.status))return;if(run.status==='running'){run.status='paused';cancelAnimationFrame(raf);$('#run-overlay').hidden=false;$('#run-overlay-title').textContent='已暂停';$('#run-overlay-note').textContent='点击“继续”或按P接着走。';$('#run-pause').textContent='继续';}else{run.status='running';run.last=performance.now();$('#run-overlay').hidden=true;$('#run-pause').textContent='暂停';raf=requestAnimationFrame(tickRun);}}
function bankRun(){if(run&&['running','paused'].includes(run.status)&&run.score>=RUN_GOAL)finishRun(true);}
function addRunPoints(points,text,color='#f3dda1'){run.points=Math.max(0,run.points+points);run.popups.push({x:roadX(run.position,playerY,run.elapsed),y:playerY-65,text,life:1,color});}
function recordList(){const records=state.runScores[state.slow?'practice':'normal'];return '<section class="run-records"><h3>本机纪录 <small>'+ (state.slow?'练习模式':'标准模式')+'</small></h3>'+(records.length?'<ol>'+records.map((r,i)=>'<li><span class="record-place">'+(i+1)+'</span><strong>'+r.points.toLocaleString('zh-CN')+'分</strong><span>'+r.books+'箱 · 最长'+r.combo+'连护</span><span>'+runGrade(r.points,r.win).label+'</span></li>').join('')+'</ol>':'<p>完成一局后，这里会留下你的得分。只记录本机游玩结果。</p>')+'</section>';}
function finishRun(win){const frame=document.createElement('canvas');frame.width=960;frame.height=540;frame.getContext('2d').drawImage($('#run-canvas'),0,0);const phase=run.elapsed<7?'山麓':run.elapsed<15?'山道':'雨途';const f={hp:run.hp,time:Math.max(0,Math.ceil(run.time)),shield:run.shield,books:run.score,base:run.points,combo:run.bestCombo,gold:run.gold,missed:run.missed,damage:run.damage};run.status=win?'won':'lost';cancelAnimationFrame(raf);f.clearBonus=win?1000:0;f.hpBonus=win?f.hp*200:0;f.timeBonus=win?f.time*10:0;f.points=f.base+f.clearBonus+f.hpBonus+f.timeBonus;const grade=runGrade(f.points,win),mode=state.slow?'practice':'normal',oldBest=currentRecord();state.runScores[mode].push({points:f.points,books:f.books,combo:f.combo,win});state.runScores[mode].sort((a,b)=>b.points-a.points);state.runScores[mode]=state.runScores[mode].slice(0,5);state.runBest=Math.max(state.runBest,f.books);if(win)state.completed[1]=true;save();render();$('#run-canvas').getContext('2d').drawImage(frame,0,0);$('#run-phase').textContent=phase;$('#run-bank').textContent=win?'已抵达':'本局结束';$('#run-start').textContent='再玩一局';$('#run-score').textContent=f.books;$('#run-points').textContent=f.points.toLocaleString('zh-CN');$('#run-combo').textContent='最长'+f.combo+'连护';$('#run-hp').textContent='●'.repeat(Math.max(0,f.hp))+'○'.repeat(3-Math.max(0,f.hp));$('#run-time').textContent=f.time;$('#run-buff').textContent=f.shield?'护罩已备':'无护罩';$('#run-overlay-title').textContent=win?grade.letter+'级 · '+grade.label:'这次没能抵达';$('#run-overlay-note').textContent=f.points.toLocaleString('zh-CN')+'分 · 保住'+f.books+'箱 · 最长'+f.combo+'连护';$('#run-message').textContent=f.points>oldBest?'本模式的新纪录！':'再来一局，试着把连护接得更长。';$('#run-result').hidden=false;$('#run-result').innerHTML='<div class="result-score"><span class="grade-seal">'+grade.letter+'</span><div><p>'+grade.label+(f.points>oldBest?' · 新纪录':'')+'</p><strong>'+f.points.toLocaleString('zh-CN')+'<small> 分</small></strong></div></div><div class="score-ledger"><span>途中积分 < function tickRun(now){if(run?.status!=='running')return;const dt=Math.min((now-run.last)/1000,.05);run.last=now;run.time-=dt;run.elapsed+=dt;run.flash=Math.max(0,run.flash-dt);run.immune=Math.max(0,run.immune-dt);run.steady=Math.max(0,run.steady-dt);run.magnet=Math.max(0,run.magnet-dt);run.position+=(run.lane-run.position)*Math.min(1,dt*15);const phase=run.elapsed<7?0:run.elapsed<15?1:2;

 for(const item of run.items){const prev=item.y;item.y+=speed*dt;const isBook=item.type==='book'||item.type==='gold',reach=isBook&&run.magnet>0?1.05:.33;
  if(!item.hit&&Math.abs(item.lane-run.position)<reach&&item.y>=playerY-28&&prev<=playerY+28){
   if(isBook){item.hit=true;run.score++;run.combo++;run.bestCombo=Math.max(run.bestCombo,run.combo);const base=item.type==='gold'?300:100,m=multiplier(run.combo);if(item.type==='gold')run.gold++;addRunPoints(base*m,'+'+(base*m)+'分');for(let i=0;i<9;i++)run.particles.push({x:roadX(item.lane,playerY,run.elapsed),y:playerY-18,vx:Math.cos(i*.8)*70,vy:-60-Math.sin(i)*35,life:.55});if(run.combo%8===0){run.steadyCharges=Math.min(2,run.steadyCharges+1);$('#run-message').textContent=run.combo+'连护，稳行机会+1。';}else $('#run-message').textContent=(item.type==='gold'?'珍本书！':'接稳了，')+'+'+(base*m)+'分。';}

document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const action=b.dataset.action,id=Number(b.dataset.id);
 if(action==='sources'){openSources();return;}if(action==='close-modal'){closeModal();return;}
 if(action==='home'){view='home';feedback='';render(true);return;}
 if(action==='chapter'){if(!Number.isInteger(id)||id<0||id>3||(id>0&&!state.completed[id-1]))return;view=id;feedback='';render(true);return;}
 if(action==='result'){if(state.completed.every(Boolean)){view='result';render(true);}return;}
 if(action==='reset'){if(!confirm('重新启程会清除当前浏览器中的行旅进度、称号、署名和计划。确定吗？'))return;state=fresh();save();try{localStorage.removeItem('qiushi-journey-v1');}catch(e){}view='home';feedback='';render(true);notify('新的行旅，已经准备好了。');return;}
 if(action==='event'&&view===0&&!state.completed[0]&&state.timeline.includes(id)&&!state.order.includes(id)){state.order.push(id);feedback='';save();render();return;}
 if(action==='undo-order'&&view===0&&!state.completed[0]){state.order.pop();feedback='';save();render();return;}
 if(action==='clear-order'&&view===0&&!state.completed[0]){state.order=[];feedback='';save();render();return;}
 if(action==='check-order'&&view===0){if(state.order.length===4&&state.order.every((n,i)=>n===state.timeline[i]))complete(0);else showFeedback('再核对一下年份与事件。提示：“求是”确立于1938年，“求是创新”确立于1988年；回杭在前，四校合并在后。可以撤回或清空重排。');return;}
 if(action==='bank-run'&&view===1){bankRun();return;}if(action==='steady-run'&&view===1){steadyRun();return;}if(action==='start-run'&&view===1){startRun();return;}if(action==='move'&&view===1){moveRun(id);return;}if(action==='pause-run'&&view===1){pauseRun();return;}
 if(action==='slow-run'&&view===1){state.slow=!state.slow;save();render();notify(state.slow?'已切换练习模式。':'已切换标准模式。');return;}
 if(action==='answer'&&view===2){const quiz=state.quiz,r=quiz.cursor;if(r>=10||quiz.answers.length>r||!Number.isInteger(id)||id<0||id>3)return;quiz.answers.push(id);save();render();$('#main .feedback')?.scrollIntoView({behavior:'instant',block:'nearest'});return;}
 if(action==='next-question'&&view===2){const quiz=state.quiz;if(quiz.cursor>=10||quiz.answers.length<=quiz.cursor)return;quiz.cursor++;save();if(quiz.cursor===10)complete(2);else render(true);return;}
 if(action==='retake-quiz'&&view===2){state.quiz=null;state.completed[2]=false;state.completed[3]=false;ensureQuiz();feedback='';save();render(true);notify('已重新抽取10道题，新的称号等你来挑战。');return;}
 if(action==='project'&&view===3&&!state.completed[3]){if(id<0||id>2)return;state.project=id;save();render();return;}
 if(action==='example'&&view===3&&!state.completed[3]){state.action=projects[state.project].example;save();$('#action-text').value=state.action;$('#char-count').textContent=state.action.length+' / 90';$('#action-text').focus();return;}
 if(action==='finish'&&view===3){state.name=$('#player-name').value.trim().slice(0,12);state.action=$('#action-text').value.trim().slice(0,90);if(state.action.replace(/\s/g,'').length<8){showFeedback('请至少填写8个非空白字符，写清什么时候、为谁、做什么。');$('#action-text').focus();return;}complete(3);return;}
 if(action==='edit-plan'){state.completed[3]=false;save();view=3;feedback='';render(true);return;}
 if(action==='download'){b.disabled=true;try{await downloadCard();notify('行动卡图片已生成，请查看浏览器下载。');}catch(e){notify('可以使用“打印行动卡”保存。');}finally{if(b.isConnected)b.disabled=false;}return;}
 if(action==='print')window.print();
});
document.addEventListener('input',e=>{if(e.target.id==='player-name'){state.name=e.target.value.slice(0,12);save();}if(e.target.id==='action-text'){state.action=e.target.value.slice(0,90);$('#char-count').textContent=state.action.length+' / 90';save();}});
document.addEventListener('pointerdown',e=>{if(e.target.id!=='run-canvas'||run?.status!=='running')return;const r=e.target.getBoundingClientRect(),x=(e.clientX-r.left)*960/r.width;run.lane=x<350?0:x<610?1:2;});
$('#modal-wrap').addEventListener('click',e=>{if(e.target===$('#modal-wrap'))closeModal();});
document.addEventListener('keydown',e=>{
 if(!$('#modal-wrap').hidden){if(e.key==='Escape'){closeModal();return;}if(e.key==='Tab'){const list=[...$('#modal').querySelectorAll('button,a[href]')],first=list[0],last=list.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('#modal'))){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}
 if(view===1&&run&&!e.target.matches('input,textarea')){if(run.status==='running'&&['ArrowLeft','ArrowRight','a','A','d','D'].includes(e.key)){e.preventDefault();moveRun(['ArrowLeft','a','A'].includes(e.key)?-1:1);}if(e.key===' '&&e.target.id==='run-canvas'){e.preventDefault();steadyRun();}if(['p','P'].includes(e.key)){e.preventDefault();pauseRun();}}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&run?.status==='running')pauseRun();});window.addEventListener('blur',()=>{if(run?.status==='running')pauseRun();});
async function downloadCard(){await document.fonts.ready;const canvas=document.createElement('canvas');canvas.width=1200;canvas.height=1440;const c=canvas.getContext('2d');c.fillStyle='#eef1df';c.fillRect(0,0,1200,1440);c.strokeStyle='#aebc98';c.lineWidth=2;c.strokeRect(35,35,1130,1370);c.strokeRect(45,45,1110,1350);c.fillStyle='#254c3c';c.font='24px "SimHei",sans-serif';c.fillText('求是行旅',90,115);c.textAlign='right';c.fillText('求是创新',1110,115);c.textAlign='left';c.beginPath();c.moveTo(90,155);c.lineTo(1110,155);c.stroke();c.font='62px "SimSun",serif';c.fillText('我的求是行动卡',90,260);c.font='25px "SimHei",sans-serif';c.fillStyle='#6a785d';c.fillText('行旅人 · '+(state.name.trim()||'一位求是青年'),90,325);c.fillStyle='#e0e8c8';c.fillRect(90,365,1020,110);c.fillStyle='#254c3c';c.font='37px "KaiTi",serif';c.fillText('本轮称号：'+titleFor(score()),115,415);c.font='23px "SimHei",sans-serif';c.fillText('知识挑战答对 '+score()+' / 10 题',115,450);c.fillStyle='#bc5333';c.font='25px "SimHei",sans-serif';c.fillText('我选择的文化创作方向 / '+projects[state.project].title,90,535);c.fillStyle='#263d35';c.font='38px "SimSun",serif';let x=90,y=620;for(const ch of state.action){if(ch==='\n'){x=90;y+=62;continue;}const w=c.measureText(ch).width;if(x+w>1100){x=90;y+=62;}c.fillText(ch,x,y);x+=w;}const sy=Math.max(1050,y+75);chapters.forEach((s,i)=>{c.save();c.translate(140+i*150,sy+50);c.rotate(-.045);c.strokeStyle='#bc5333';c.lineWidth=2;c.strokeRect(-50,-50,100,100);c.strokeRect(-43,-43,86,86);c.fillStyle='#bc5333';c.font='31px "KaiTi",serif';c.textAlign='center';c.fillText(s.stamp,0,11);c.restore();});c.strokeStyle='#bdc7aa';c.beginPath();c.moveTo(90,1250);c.lineTo(1110,1250);c.stroke();c.fillStyle='#748064';c.font='24px "SimHei",sans-serif';c.fillText('循校史之脉 · 以青年之创',90,1310);c.font='20px "SimHei",sans-serif';c.fillText('游戏纪念卡 · 记录行动计划 · 非官方证明',90,1355);const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw Error('export');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='我的求是行动卡.png';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
render();if(oldProgress)notify('原来的署名和计划还在，题库已更新。');
